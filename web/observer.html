<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecondVisit observer</title>
    <style>
      body { margin: 0; height: 100vh; background: var(--c-bg, #fff); color: var(--c-ink); font: var(--fs-proj-min) system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 64fr 36fr; grid-template-rows: 6vh 1fr auto; height: 100vh; }
      #bar { grid-column: 1 / 3; display: flex; gap: 3vw; align-items: center; padding: 0 2vw; font-size: var(--fs-proj-min); }
      #main { display: flex; flex-direction: column; min-height: 0; }
      #plan { flex: 1; width: 100%; min-height: 0; background: var(--c-surface); }
      #legend { display: flex; flex-wrap: wrap; gap: 0.5vw 2vw; padding: 0.5vh 1vw; font-size: var(--fs-proj-min); }
      #side { display: flex; flex-direction: column; gap: 1vh; padding: 1vh 1vw; min-height: 0; overflow: auto; }
      #tour { aspect-ratio: 16 / 9; border: 1px dashed currentColor; display: grid; place-items: center; }
      .glass-panel { padding: 1vh 1vw; font-size: var(--fs-proj-body); }
      table { border-collapse: collapse; font-size: var(--fs-proj-body); } th, td { padding: 0.3vh 1vw; text-align: left; }
      #caption { grid-column: 1 / 3; padding: 1vh 2vw; font-size: var(--fs-proj-caption); min-height: 2.4em; border-top: 2px solid var(--c-ink); }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <header id="bar" class="glass-bar"><strong id="title">Observer</strong><span id="runinfo">Run 1</span><span id="quiz"></span><span id="point"></span></header>
      <main id="main">
        <canvas id="plan" role="img" aria-label="Plan"></canvas>
        <div id="legend">
          <span>Wall: black line</span><span>Glass: teal double line</span><span>Obstacle: orange box</span>
          <span>Chair or movable: orange dashes</span><span>Stairs: hatched</span><span>Route: blue</span>
          <span>Run 1: grey dashed</span><span>Run 2: blue</span><span>You: yellow disc</span>
        </div>
      </main>
      <aside id="side">
        <div id="tour">Showcase tour (Task 18)</div>
        <section class="glass-panel" aria-live="off"><h2 style="font-size:var(--fs-proj-h);margin:0">Run 1 vs run 2</h2><table id="table"></table><p id="coach"></p></section>
      </aside>
      <div id="caption" aria-live="off"></div>
    </div>
    <script type="module" src="/src/observer/observer.ts"></script>
  </body>
</html>
